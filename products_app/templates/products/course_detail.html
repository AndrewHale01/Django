{% extends 'products/layout.html' %}

{% block content %}
  <style>
    .course-detail {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 15px;
    }

    .course-detail__card {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .course-detail__image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .course-detail__info {
      padding: 36px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .course-detail__title {
      margin: 0 0 18px;
      font-size: 2.4rem;
      line-height: 1.08;
    }

    .course-detail__text {
      margin: 0 0 26px;
      color: #4f5667;
      line-height: 1.75;
      font-size: 1rem;
    }

    .course-detail__price {
      margin: 0 0 24px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f3d7a;
    }

    @media (max-width: 820px) {
      .course-detail__card {
        grid-template-columns: 1fr;
      }

      .course-detail__info {
        padding: 26px;
      }
    }
  </style>
  <button type="button" class="btn btn-outline-danger" onclick="window.location.href='{% url 'index' %}'">
  ⭠ Повернутись до курсів
  </button>
  <div class="course-detail">
    <div class="course-detail__card">
      <div class="course-detail__image">
        <img src="{{ course.image }}" alt="{{ course.title }}">
      </div>

      <div class="course-detail__info">
        <h1 class="course-detail__title">{{ course.title }}</h1>
        <p class="course-detail__text">{{ course.description }}</p>
        <p class="course-detail__price">Ціна: {{ course.price }} грн</p>
      </div>
    </div>
  </div>
{% endblock %}

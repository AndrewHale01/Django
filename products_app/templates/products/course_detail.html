{% extends 'products/layout.html' %}

{% block content %}
<div class="my-4">
  <a href="{% url 'index' %}" class="btn btn-outline-secondary rounded-pill px-4 fw-medium">
    <i class="bi bi-arrow-left me-2"></i>Повернутись до курсів
  </a>
</div>

<div class="card border-0 shadow rounded-4 overflow-hidden my-5">
  <div class="row g-0">
    <div class="col-md-6 bg-light d-flex align-items-center justify-content-center p-4" style="min-height: 350px;">
      <img src="{{ course.image }}" alt="{{ course.title }}" class="img-fluid rounded-3" style="max-height: 100%; object-fit: contain;">
    </div>
    <div class="col-md-6 d-flex align-items-center">
      <div class="card-body p-5">
        <h1 class="fw-bold display-6 mb-3 text-dark">{{ course.title }}</h1>
        <p class="text-muted fs-5 mb-4">{{ course.description }}</p>
        <h3 class="fw-bold text-primary mb-4">Ціна: {{ course.price }} грн</h3>
        <div class="d-flex flex-wrap gap-2">
          <form method="post" action="{% url 'add_to_cart' course.id %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill fw-medium">
              <i class="bi bi-cart-plus me-2"></i>До кошика
            </button>
          </form>
          <form method="post" action="{% url 'toggle_favorite' course.id %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="btn btn-outline-danger btn-lg rounded-pill" title="Додати в улюблені">
              <i class="bi {% if course.id in favorite_course_ids %}bi-heart-fill{% else %}bi-heart{% endif %}"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
